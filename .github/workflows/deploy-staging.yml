name: Deploy para staging

# O servidor não tem Composer nem Node, por isso os assets são compilados aqui.
# O vendor/ NÃO é enviado por omissão: são ~14 mil ficheiros e o FTP do servidor
# corta a ligação a meio. Já está instalado no servidor e só muda quando o
# composer.lock muda — nesse caso, correr manualmente com "enviar_vendor: true".
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      enviar_vendor:
        description: 'Enviar também o vendor/ (só quando o composer.lock mudar)'
        type: boolean
        default: false

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Preparar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: bcmath, ctype, curl, dom, fileinfo, intl, mbstring, pdo_sqlite, zip
          coverage: none

      - name: Instalar dependências PHP
        run: composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Compilar assets
        run: |
          npm ci
          npm run build

      - name: Definir exclusões
        id: exc
        run: |
          {
            echo 'lista<<FIM'
            cat <<'BASE'
          **/.git*
          **/.git*/**
          **/node_modules/**
          **/tests/**
          .env
          .env.*
          database/database.sqlite
          storage/**
          public/storage/**
          public/atualizar.php
          *.md
          .editorconfig
          .cpanel.yml
          phpunit.xml
          package*.json
          composer.*
          vite.config.js
          BASE
            if [ "${{ inputs.enviar_vendor }}" != "true" ]; then
              echo 'vendor/**'
            fi
            echo 'FIM'
          } >> "$GITHUB_OUTPUT"

      - name: Enviar ficheiros por FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          timeout: 120000
          exclude: ${{ steps.exc.outputs.lista }}

      - name: Correr migrações e reconstruir caches
        run: |
          codigo=$(curl -sS -o /tmp/deploy.log -w "%{http_code}" -X POST \
            -H "X-Deploy-Secret: ${{ secrets.DEPLOY_SECRET }}" \
            --max-time 600 \
            "${{ secrets.DEPLOY_URL }}")
          cat /tmp/deploy.log
          if [ "$codigo" != "200" ]; then
            echo "::error::O pós-deploy devolveu HTTP $codigo"
            exit 1
          fi
