name: Preparar branch de deploy

# O servidor não tem Composer nem Node, e nem FTP nem SSH funcionam de forma
# fiável. O que funciona é o Git Version Control do cPanel. Por isso o GitHub
# compila tudo e publica o resultado pronto a correr no branch "deploy", que o
# cPanel depois puxa com "Update from Remote".
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-deploy-branch
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Preparar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: bcmath, ctype, curl, dom, fileinfo, intl, mbstring, pdo_sqlite, zip
          coverage: none

      - name: Instalar dependências PHP
        run: composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Compilar assets
        run: |
          npm ci
          npm run build

      - name: Publicar no branch deploy
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # O branch deploy inclui vendor/ e public/build (que o .gitignore
          # normalmente exclui), porque o servidor não os consegue gerar.
          cat > .gitignore <<'FIM'
          /node_modules
          /.github
          /tests
          # O cPanel grava os logs de cada deploy nesta pasta. Se não for
          # ignorada, fica "por commitar" e bloqueia os deploys seguintes.
          /.cpanel
          /storage/logs/*
          /storage/framework/cache/data/*
          /storage/framework/sessions/*
          /storage/framework/views/*
          /public/storage
          /database/database.sqlite
          .env
          .env.*
          !.env.production.example
          FIM

          # A história do branch deploy tem de ser contínua: se cada build criar
          # um commit sem relação com o anterior, o "Update from Remote" do
          # cPanel não consegue avançar e falha. Por isso o novo commit é sempre
          # filho do anterior.
          git fetch origin deploy 2>/dev/null && existe=1 || existe=0

          if [ "$existe" = "1" ]; then
            git branch -f deploy origin/deploy
          else
            git branch -f deploy
          fi

          # Muda de branch sem tocar nos ficheiros já compilados
          git symbolic-ref HEAD refs/heads/deploy
          git reset

          git add -A
          if git diff --cached --quiet; then
            echo "Sem alterações para publicar."
          else
            git commit -q -m "build: $GITHUB_SHA"
            git push -q origin deploy
            echo "Branch deploy atualizado a partir de $GITHUB_SHA"
          fi
